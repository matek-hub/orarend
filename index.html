const huMonths=["január","február","március","április","május","június","július","augusztus","szeptember","október","november","december"];
function d(s){return new Date(s+"T00:00:00")}
function fmt(x){return x.getDate()+". "+huMonths[x.getMonth()]+" "+x.getFullYear()}
function render(){
  const now=new Date(); now.setHours(0,0,0,0);
  let item=data.find(x=>now>=d(x.start)&&now<=d(x.end));
  let next=data.find(x=>d(x.start)>now);
  const c=document.getElementById("content");
  if(item){
    const s=d(item.start), e=d(item.end);
    const dayLabels=["H","K","Sze","Cs","P"];
    let segs="", labels="";
    for(let i=0;i<5;i++){
      const dd=new Date(s); dd.setDate(dd.getDate()+i);
      let cls = dd.getTime()===now.getTime() ? "today" : (dd.getTime()<now.getTime() ? "past" : "");
      segs += `<div class="week-seg ${cls}"></div>`;
      labels += `<span class="${cls==="today"?"today-label":""}">${dayLabels[i]}</span>`;
    }
    c.innerHTML=`<div class="badge">${item.week ? item.week+". tanítási hét" : "Vakáció"}</div>
      <div class="main">${item.week ? "Tanítás" : "Szünet"}</div>
      <div class="date">${fmt(s)} – ${fmt(e)}</div>
      ${item.note ? `<div class="note">${item.note}</div>` : ""}
      <div class="week-track">${segs}</div>
      <div class="week-labels">${labels}</div>`;
  } else if(next){
    c.innerHTML=`<div class="badge">Következő időszak</div>
      <div class="main">${next.week ? next.week+". tanítási hét" : "Szünet"}</div>
      <div class="date">${fmt(d(next.start))} – ${fmt(d(next.end))}</div>
      ${next.note ? `<div class="note">${next.note}</div>` : ""}`;
  } else {
    c.innerHTML=`<div class="empty">A megadott tanév időszakán kívül vagyunk.</div>`;
  }

  const vacInfo = document.getElementById("vacation-info");
  if(item && item.week === null){
    vacInfo.innerHTML = "Jelenleg vakáció van 🎉";
  } else {
    const nextVac = data.find(x => x.week === null && d(x.start) > now);
    if(nextVac){
      const vacStart = d(nextVac.start);
      const dow = now.getDay(); // 0=vas .. 6=szo
      const monIdx = (dow + 6) % 7; // 0=hét .. 6=vas
      const nextMonday = new Date(now);
      nextMonday.setDate(nextMonday.getDate() + (7 - monIdx));
      if(vacStart < nextMonday){
        vacInfo.innerHTML = "Ezen a héten kezdődik a legközelebbi <b>vakáció</b>!";
      } else {
        const weeksGap = Math.round((vacStart - nextMonday) / (7*86400000));
        if(weeksGap === 0){
          vacInfo.innerHTML = "Jövő héten kezdődik a legközelebbi <b>vakáció</b>!";
        } else {
          vacInfo.innerHTML = `<b>${weeksGap} hét</b> van a legközelebbi vakációig`;
        }
      }
    } else {
      vacInfo.innerHTML = "";
    }
  }
}
render();

   Az érintett óránál 📝 ikon és "FELMÉRŐ" jelzés jelenik meg.
   Példa:
   { date: "2026-10-05", period: 3, note: "Törtek" },

const FELMERESEK = [
  // { date: "2026-10-05", period: 3, note: "Törtek" },
];

function pad(n){return n.toString().padStart(2,"0")}
function timeStr(m){return pad(Math.floor(m/60))+":"+pad(m%60)}

let userTests = []; // { _key, date, period, note } — a Firebase-ből töltve, valós időben szinkronizálva
fbDb.ref("felmeresek").on("value", snapshot => {
  const val = snapshot.val() || {};
  userTests = Object.keys(val).map(key => ({ _key: key, ...val[key] }));
  renderSchedule();
});
function allTests(){ return FELMERESEK.concat(userTests); }

function populatePeriodSelect(){
  const sel = document.getElementById("test-period");
  sel.innerHTML = PERIODS.map((p,i)=>`<option value="${i+1}">${i+1}. óra (${timeStr(p[0])}–${timeStr(p[1])})</option>`).join("");
}

function saveTest(){
  if(!fbAuth.currentUser){ alert("Előbb jelentkezz be, hogy felmérőt tudj menteni!"); return; }
  const date = document.getElementById("test-date").value;
  const period = parseInt(document.getElementById("test-period").value, 10);
  const note = document.getElementById("test-note").value.trim();
  if(!date){ alert("Add meg a dátumot!"); return; }
  fbDb.ref("felmeresek").push({ date, period, note })
    .catch(err => alert("Hiba mentéskor: " + err.message));
  document.getElementById("test-date").value = "";
  document.getElementById("test-note").value = "";
  toggleTestForm();
}

function removeTest(date, period){
  if(!fbAuth.currentUser){ alert("Előbb jelentkezz be, hogy törölni tudj!"); return; }
  if(!confirm("Törlöd ezt a felmérő-jelölést?")) return;
  const match = userTests.find(t => t.date === date && t.period === period);
  if(match && match._key){
    fbDb.ref("felmeresek/" + match._key).remove()
      .catch(err => alert("Hiba törléskor: " + err.message));
  }
}

let dayOffset = 0;

function shiftDay(n, reset){
  dayOffset = reset ? 0 : dayOffset + n;
  renderSchedule();
}

function renderSchedule(){
  const real = new Date();
  const now = new Date(real);
  now.setDate(now.getDate() + dayOffset);
  const isToday = dayOffset === 0;
  const cur = real.getHours()*60 + real.getMinutes();
  const day = now.getDay();
  const title = document.getElementById("sched-title");
  const box = document.getElementById("sched-content");
  const todayBtn = document.getElementById("today-btn");
  todayBtn.classList.toggle("active", isToday);
  const today = ORAREND[day];

  const dateLabel = `<span class="sched-date">${now.getDate()}. ${huMonths[now.getMonth()]} ${now.getFullYear()}</span>`;
  const dayName = HU_DAYS[day].charAt(0).toUpperCase()+HU_DAYS[day].slice(1);
  const heading = isToday ? "Mai órarend — " + dayName : dayName + " órarendje";

  if(!today){
    title.innerHTML = heading + dateLabel;
    box.innerHTML = `<div class="sched-none">${isToday ? "Ma" : "Ezen a napon"} (${HU_DAYS[day]}) nincs tanítás.</div>`;
    return;
  }
  title.innerHTML = heading + dateLabel;

  let nextIdx = -1;
  if(isToday){
    for(let i=0;i<PERIODS.length;i++){ if(PERIODS[i][0] > cur){ nextIdx = i; break; } }
  }

  const ymd = now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());

  const rows = PERIODS.map((p,i)=>{
    const cls = today[i] || "";
    if(!cls) return "";
    const isNow = isToday && cur >= p[0] && cur < p[1];
    const isNext = isToday && i === nextIdx && cls;
    const test = allTests().find(t => t.date === ymd && t.period === i+1);
    let state = (isNow ? "now" : (isNext ? "next" : "")) + (test ? " has-test" : "");
    const tags = [];
    if(isNow) tags.push(`<span class="sched-tag">MOST</span>`);
    if(isNext) tags.push(`<span class="sched-tag">KÖVETKEZŐ</span>`);
    if(test) tags.push(`<span class="sched-tag tag-test" onclick="removeTest('${ymd}',${i+1})" title="Kattints a törléshez">📝 FELMÉRŐ ✕</span>`);
    return `<div class="sched-row ${state}">
      <div class="sched-time">${timeStr(p[0])}–${timeStr(p[1])}</div>
      <div class="sched-class">${cls}${test && test.note ? `<div class="sched-test-note">${test.note}</div>` : ""}</div>
      <div class="sched-tags">${tags.join("")}</div>
    </div>`;
  }).join("");
  box.innerHTML = rows || `<div class="sched-none">${isToday ? "Ma" : "Ezen a napon"} nincs egyetlen órád sem.</div>`;
}
populatePeriodSelect();
renderSchedule();
setInterval(renderSchedule, 60000);
</script>
</body>
